[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iceberg-stream-lakehouse"
version = "0.1.0"
description = "Production-grade event streaming lakehouse architecture with PyIceberg, DuckDB, Great Expectations, and dbt"
readme = "README.md"
authors = [{ name = "Suvam Sen", email = "suvamsen172420@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyiceberg[s3fs,duckdb]>=0.7.0",
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "confluent-kafka>=2.3.0",
    "great-expectations>=0.18.0",
    "dbt-duckdb>=1.8.0",
    "orjson>=3.10.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
